<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="Most used languages">
<title>Most used languages</title>

<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .title { font: 600 16px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .label { font: 400 12px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .muted { font: 400 12px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #59636e; }
  .big { font: 700 26px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .accent { fill: #0969da; }
  .track { fill: #eff2f5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .title, .label, .big { fill: #e6edf3; }
    .muted { fill: #9198a1; }
    .accent { fill: #4493f8; }
    .track { fill: #21262d; }
  }
</style>

  <rect class="bg" x="0.5" y="0.5" width="419" height="219" rx="8"/>
  <text class="title" x="24" y="34">Most used languages</text>
  <rect class="track" x="24" y="52" width="372" height="10" rx="5"/>
  <clipPath id="bar"><rect x="24" y="52" width="372" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)">
  <rect x="24.00" y="52" width="97.46" height="10" fill="#7355dd"/>
  <rect x="120.96" y="52" width="92.05" height="10" fill="#3178c6"/>
  <rect x="212.51" y="52" width="79.90" height="10" fill="#F05138"/>
  <rect x="291.91" y="52" width="52.69" height="10" fill="#e34c26"/>
  <rect x="344.10" y="52" width="21.07" height="10" fill="#f1e05a"/>
  <rect x="364.67" y="52" width="20.25" height="10" fill="#3572A5"/>
  <rect x="384.42" y="52" width="5.29" height="10" fill="#519aba"/>
  <rect x="389.21" y="52" width="2.42" height="10" fill="#663399"/>
  <rect x="391.13" y="52" width="5.37" height="10" fill="#8b949e"/>
  </g>
  <circle cx="29" cy="88" r="5" fill="#7355dd"/>
  <text class="label" x="40" y="92">C#</text>
  <text class="muted" x="194" y="92" text-anchor="end">26.1%</text>
  <circle cx="219" cy="88" r="5" fill="#3178c6"/>
  <text class="label" x="230" y="92">TypeScript</text>
  <text class="muted" x="384" y="92" text-anchor="end">24.6%</text>
  <circle cx="29" cy="112" r="5" fill="#F05138"/>
  <text class="label" x="40" y="116">Swift</text>
  <text class="muted" x="194" y="116" text-anchor="end">21.3%</text>
  <circle cx="219" cy="112" r="5" fill="#e34c26"/>
  <text class="label" x="230" y="116">HTML</text>
  <text class="muted" x="384" y="116" text-anchor="end">14.0%</text>
  <circle cx="29" cy="136" r="5" fill="#f1e05a"/>
  <text class="label" x="40" y="140">JavaScript</text>
  <text class="muted" x="194" y="140" text-anchor="end">5.5%</text>
  <circle cx="219" cy="136" r="5" fill="#3572A5"/>
