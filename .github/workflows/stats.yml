name: Update profile stats

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check token
        id: token
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::warning::STATS_TOKEN secret is not set; skipping update so the existing cards stay intact."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate stat cards
        if: steps.token.outputs.ok == 'true'
        env:
          # Personal access token (yours) with read access to your repos,
          # so private repos and private contributions are counted.
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          EXCLUDE_LANGS: ""
        run: python scripts/generate_stats.py

      - name: Commit changes
        if: steps.token.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push
